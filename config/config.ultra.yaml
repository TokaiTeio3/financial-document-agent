    compact_uncertain_joint_review: true
    compact_joint_review_domains: []
    compact_joint_review_max_tokens: 500
    compact_calc_hits: 6
    compact_calc_excerpt_chars: 1100
    calculation_prompt_chars: 800
    calculation_prompt_hits: 8
    calculation_table_anchor_limit: 8
    calculation_table_anchor_context_chars: 200
    calculation_table_anchor_row_chars: 400
    insurance_calculation_prompt_chars: 1900
    insurance_calculation_prompt_hits: 11
    python_tool: true
    python_tool_domains: []
    compact_calc_direct: true
    compact_calc_reasoning_call: false
    compact_calc_reasoning_max_tokens: 260
    llm_query_planner: true
    llm_query_planner_domains:
      - research
    use_prior_api_answer_memory: false
    prior_api_reasoning_chars: 1200
    # 预留保护会对并发进行中的调用采用保守 Prompt 字符数估计。
    # 竞赛硬性检查仍以下方实测 submission_token_limit 为准。
    token_budget: 1030000
    submission_token_limit: 1000000
  compressed: &compressed_defaults
    require_clean_git: true
    multi_min_options: 2
    evidence_budget_controller: shadow
    evidence_sufficiency_threshold: 0.62
    query_max_tokens: 320
    answer_max_tokens: 700
    repair_max_tokens: 420
    max_docs: 8
    retrieval_top_k: 20
