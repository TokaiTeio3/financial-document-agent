      - financial_contracts
      - insurance
      - regulatory
      - research
    force_joint_domains:
      - financial_reports
    compact_joint_unknown_fallback_domains:
      - financial_reports
    force_joint_unconditional_domains:
      - financial_reports
      - insurance
    option_entity_binding_domains:
      - insurance
      - financial_reports
      - financial_contracts
      - research
    compact_option_hits: 3
    compact_excerpt_chars: 550
    compact_research_option_hits: 2
    compact_research_excerpt_chars: 160
    compact_research_bridge_hits: 5
    compact_research_bridge_excerpt_chars: 360
    compact_financial_option_hits: 3
    compact_financial_excerpt_chars: 550
    compact_joint_review_excerpt_chars: 360
    compact_contract_option_hits: 3
    compact_contract_excerpt_chars: 600
    contract_quantitative_joint: true
    compact_financial_bridge_hits: 4
    compact_financial_bridge_excerpt_chars: 240
    compact_bridge_wide_on_multiple_unknowns: false
    compact_bridge_wide_domains: []
    compact_bridge_max_tokens: 360
    compact_insurance_option_hits: 2
    compact_joint_insurance_option_hits: 3
    compact_joint_hard_option_hit_cap: 2
    compact_insurance_excerpt_chars: 260
    compact_insurance_bridge_hits: 5
    compact_insurance_bridge_excerpt_chars: 320
    compact_insurance_bridge_max_tokens: 360
    compact_regulatory_option_hits: 2
    compact_joint_regulatory_option_hits: 2
    compact_regulatory_excerpt_chars: 260
    compact_option_max_tokens: 240
    # 仅用于采样的硬上限。每个副本仍从原始文档检索，
    # 但只接收严格有界的证据视图。
    compact_hard_evidence_hit_cap: 2
    compact_hard_excerpt_chars_cap: 360
    compact_hard_bridge_hit_cap: 4
    compact_hard_bridge_excerpt_chars_cap: 260
    compact_uncertain_joint_review: false
    compact_joint_review_domains: []
    compact_joint_review_max_tokens: 320
    compact_calc_hits: 4
    compact_calc_excerpt_chars: 650
    calculation_prompt_chars: 600
    calculation_prompt_hits: 6
    calculation_table_anchor_limit: 8
    calculation_table_anchor_context_chars: 120
    calculation_table_anchor_row_chars: 260
    insurance_calculation_prompt_chars: 1400
    insurance_calculation_prompt_hits: 8
    regulatory_calculation_prompt_chars: 950
    regulatory_calculation_prompt_hits: 10
    python_tool: true
    python_tool_domains: []
    skip_compact_calc_domains: []
    max_calculation_prompt_chars: 0
    max_research_calculation_prompt_chars: 16000
    calculation_structured_anchor_retry: false
    compact_calc_direct: true
    compact_calc_reasoning_max_tokens: 210
    llm_query_planner: false
    llm_query_planner_domains: []
    use_prior_api_answer_memory: false
    prior_api_reasoning_chars: 800
    # 仅用于后处理：追加已存在于计费 API Prompt 中的精确引用证据子串。
    # 这使 E1/E2 reasoning 可审计，且不增加 API 调用或 Token 用量。
    reasoning_expand_prompt_evidence: false
    reasoning_evidence_max_refs: 4
    reasoning_evidence_chars_per_ref: 220
    # 内部并发预留上限；最终实测提交量必须严格低于 submission_token_limit。
    token_budget: 650000
    # 榜单最佳成本档位包含 500500。
    # 校验器将此字段视为不包含边界值的上限。
    submission_token_limit: 500501
  lean:
    <<: *compressed_defaults
    compact_option_hits: 2
    compact_excerpt_chars: 420
    compact_research_option_hits: 2
    compact_research_excerpt_chars: 140
    compact_research_bridge_hits: 4
    compact_research_bridge_excerpt_chars: 300
    compact_financial_option_hits: 2
