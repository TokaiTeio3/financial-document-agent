    repair_max_tokens: 650
    max_docs: 8
    retrieval_top_k: 24
    prompt_pages: 9
    page_chars: 800
    option_top_k: 4
    verify: false
    option_adjudication: false
    compact_joint_answer: true
    compact_option_adjudication: true
    compact_joint_domains:
      - financial_contracts
      - insurance
      - regulatory
      - research
    compact_joint_unknown_fallback_domains:
      - financial_contracts
    option_entity_binding_domains:
      - insurance
      - financial_reports
      - financial_contracts
      - research
    compact_option_hits: 2
    compact_excerpt_chars: 750
    compact_research_option_hits: 4
    compact_research_excerpt_chars: 240
    compact_research_bridge_hits: 8
    compact_research_bridge_excerpt_chars: 500
    compact_financial_option_hits: 2
    compact_financial_excerpt_chars: 360
    compact_joint_review_excerpt_chars: 500
    compact_contract_option_hits: 3
    compact_contract_excerpt_chars: 850
