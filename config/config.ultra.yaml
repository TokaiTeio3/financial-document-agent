    compact_calc_hits: 4
    compact_calc_excerpt_chars: 560
    calculation_prompt_chars: 540
    calculation_prompt_hits: 5
    calculation_table_anchor_limit: 7
    calculation_table_anchor_context_chars: 100
    calculation_table_anchor_row_chars: 230
    insurance_calculation_prompt_chars: 1250
    insurance_calculation_prompt_hits: 7
    regulatory_calculation_prompt_chars: 850
    regulatory_calculation_prompt_hits: 9
    max_research_calculation_prompt_chars: 14000

  reproduction:
    # 正式冷启动配置。在保持实测运行接近提交成本档位的同时，
    # 仅当通用结构风险信号表明联合回答证据不足时，
    # 才选择性增加上下文或调用次数。
    <<: *compressed_defaults
    require_clean_git: false
    # 正式复现路径不得使用答案数量先验。
    # 选择只能由当前题目返回的证据驱动。
    multi_min_options: 0
    # 格式错误的单选或判断结果会接受一次绑定证据的 API 修复。
    # 此过程只校验输出结构，不预设答案。
    compact_invalid_answer_review: true
    force_joint_unconditional_domains: []
    # 对条款密集合同，若联合裁决仍为未知，则交由独立选项裁决器重新阅读。
    # 触发条件是当前 API 输出的不确定性，而不是 qid、实体列表或历史答案。
    compact_joint_unknown_fallback_domains:
      - financial_contracts
    # 实验表明，第二个仲裁器成本更高，可靠性也低于保留独立证据绑定的选项裁决。
    # 复核只用于路由内部的无效选项数量。
    compact_uncertain_joint_review: false
    compact_joint_review_domains: []
    compact_financial_option_hits: 3
    compact_financial_excerpt_chars: 450
    compact_financial_bridge_hits: 5
    compact_financial_bridge_excerpt_chars: 300
    compact_insurance_option_hits: 3
    compact_joint_insurance_option_hits: 3
    compact_insurance_excerpt_chars: 320
    compact_insurance_bridge_hits: 6
    compact_insurance_bridge_excerpt_chars: 360
    compact_hard_evidence_hit_cap: 3
    compact_hard_excerpt_chars_cap: 450
    compact_hard_bridge_hit_cap: 5
    compact_hard_bridge_excerpt_chars_cap: 340
    adaptive_calculation_evidence: true
    adaptive_calculation_prompt_chars: 520
    adaptive_calculation_prompt_hits: 6
    adaptive_contract_excerpt_chars: 850
    token_budget: 700000
    # 已发布的约 50 万 Token 提交允许复现结果最多上浮 15%。
    # 校验器将此值视为不包含边界值的上限。
    # 提交总量约为 50 万 Token，赛事方接受正负 15% 波动；
    # 此排他性保护可防止结果意外越界。
    submission_token_limit: 575001

