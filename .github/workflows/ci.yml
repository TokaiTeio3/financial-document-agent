name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  competition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/audit_public_release.py

  langgraph-demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: financial_qa_agent
    env:
      FINQA_DEMO_MODE: 'true'
      FINQA_DATA_ROOT: tests/fixtures/corpus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
      - run: node --check app/web/static/app.js
      - run: python scripts/evaluate_ground_truth.py --mode agent --ground-truth tests/fixtures/ground_truth.json
